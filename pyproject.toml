[project]
name = "sensors-and-intelligent-detection"
version = "0.1.0"
description = "传感器与智能监测技术代码实践"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pywavelets>=1.9.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "xgboost>=3.4.0",
    "torch>=2.7.0",
    "torchinfo>=1.8.0",
    "torchvision>=0.22.0",
    "scikit-opt>=0.6.6",
    "statsmodels>=0.14.6",
    "opencv-python>=5.0.0.93",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
]